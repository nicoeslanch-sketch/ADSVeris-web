<!DOCTYPE html>
<html lang="es">
<head>
<title>Catálogo de planillas Excel | ADS Veris</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Catalogo de plantillas ADS Veris para estados financieros, caja, operacion, comercial, analisis y finanzas personales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script defer src="assets/products.js"></script>
<script src="site-config.js"></script>
<script type="module" src="assets/script.js"></script>
</head>
<body data-page="tienda">
<div data-header></div>

<main>
  <section class="section section-tight store-catalog-section">
    <div class="container">
      <div class="section-head">
        <div>
          <span class="eyebrow">Planillas Excel para tu negocio</span>
          <h1 class="page-title-compact">Encuentra la planilla que necesitas.</h1>
          <p class="small" data-store-intro>Revisa las planillas, su compatibilidad y las condiciones de disponibilidad antes de solicitar un archivo.</p>
        </div>
        <div class="small" data-store-count role="status" aria-live="polite">11 productos disponibles</div>
      </div>
      <div data-launch-promotion></div>
      <div class="catalog-search">
        <label for="catalog-search">Busca una planilla para tu necesidad</label>
        <input id="catalog-search" type="search" data-store-search placeholder="Por ejemplo: caja, inventario o ventas" maxlength="100" autocomplete="off">
      </div>
      <div class="filters" aria-label="Filtrar planillas por categoría">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="estados">Estados financieros</button>
        <button class="filter-btn" data-filter="caja">Caja y presupuesto</button>
        <button class="filter-btn" data-filter="operacion">Operación</button>
        <button class="filter-btn" data-filter="comercial">Comercial</button>
        <button class="filter-btn" data-filter="analisis">Análisis</button>
        <button class="filter-btn" data-filter="personal">Personas</button>
      </div>
      <div class="product-grid" data-store-products></div>
      <p class="catalog-empty small" data-store-empty hidden>No encontramos planillas con esos filtros. Prueba otra búsqueda o <button type="button" class="text-link" data-store-clear>mostrar todas las planillas</button>.</p>
    </div>
  </section>
</main>

<div data-footer></div>
</body>
</html>
